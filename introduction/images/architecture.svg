<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-label="Native cursor bridge identity and data enforcement flow">
<rect width="1100" height="660" fill="#faf9f7"/>
<text x="40" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Native agent with DDS authorized cursors</text>
<rect x="40" y="85" width="1020" height="85" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="115" font-family="Arial,sans-serif" font-size="21" font-weight="bold">1  Authenticate the employee or manager</text>
<text x="60" y="144" font-family="Arial,sans-serif" font-size="16">Oracle authenticates DDS_EMMA or DDS_MARVIN; the client checks identity and PDB.</text>
<path d="M550 172 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#8b4330" stroke-width="2"/>
<rect x="40" y="197" width="1020" height="85" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="227" font-family="Arial,sans-serif" font-size="21" font-weight="bold">2  Open fixed query cursors with invoker rights</text>
<text x="60" y="256" font-family="Arial,sans-serif" font-size="16">DDS filters table and view rows and masks sensitive values under the authenticated consumer.</text>
<path d="M550 284 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#8b4330" stroke-width="2"/>
<rect x="40" y="309" width="1020" height="85" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="339" font-family="Arial,sans-serif" font-size="21" font-weight="bold">3  Run the native Oracle agent team</text>
<text x="60" y="368" font-family="Arial,sans-serif" font-size="16">The no-authentication runtime calls RUN_TEAM and OCI xai.grok-4.3 selects fetch-only tools.</text>
<path d="M550 396 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#8b4330" stroke-width="2"/>
<rect x="40" y="421" width="1020" height="85" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="451" font-family="Arial,sans-serif" font-size="21" font-weight="bold">4  Fetch only the authorized cursor results</text>
<text x="60" y="480" font-family="Arial,sans-serif" font-size="16">Runtime has no employee-table privileges or data roles; model inputs contain no identity or SQL.</text>
<path d="M550 508 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#8b4330" stroke-width="2"/>
<rect x="40" y="533" width="1020" height="85" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="563" font-family="Arial,sans-serif" font-size="21" font-weight="bold">5  Validate native completion and show the answer</text>
<text x="60" y="592" font-family="Arial,sans-serif" font-size="16">Require SUCCEEDED and matching tool principal; clear cursors, cache and conversation.</text>
</svg>
