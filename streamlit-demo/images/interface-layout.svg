<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-label="Streamlit presenter interface">
<rect width="100%" height="100%" fill="#faf9f7"/>
<text x="40" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Streamlit presenter interface</text>
<text x="40" y="78" font-family="Arial,sans-serif" font-size="17" fill="#555">Conceptual layout guide; this is not a captured application result</text>
<rect x="40" y="110" width="1020" height="70" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="138" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Sidebar  Persona and password</text>
<text x="60" y="163" font-family="Arial,sans-serif" font-size="17">Sign in as Emma or Marvin. Sign out clears the prior session data.</text>
<rect x="40" y="210" width="1020" height="70" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="238" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Top  Active identity and prompt</text>
<text x="60" y="263" font-family="Arial,sans-serif" font-size="17">Display the verified principal, PDB, model, selected prompt, and submitted request.</text>
<rect x="40" y="310" width="1020" height="70" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="338" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Left  Database tool results</text>
<text x="60" y="363" font-family="Arial,sans-serif" font-size="17">Inspect authorized records, salary totals, and exact raw JSON including protected NULL values.</text>
<rect x="40" y="410" width="1020" height="70" rx="5" fill="white" stroke="#bbb"/>
<text x="60" y="438" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Right  AI response</text>
<text x="60" y="463" font-family="Arial,sans-serif" font-size="17">Compare the explanation with tool evidence. Probe mode does not invoke the model.</text>
</svg>
